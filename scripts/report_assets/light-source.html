<!doctype html>
<!-- Source of light.jpg, the window light in the header of the report's first
     page. The site's window (site/index.html) at its morning colors, projected
     obliquely with sage leaf shadows, fading into the paper.

     It is rendered once to an opaque image (scripts/render_light.py, `make
     report-light`) instead of being drawn in the PDF: blur, soft masks and
     blend modes are read differently by each PDF viewer (macOS Preview cut the
     panes and left a grey band), while a flat image looks the same everywhere.
     The box is the light's place on the page: 110mm x 97mm in the top right
     corner of the first page's text area (Chrome clips print content at the
     page margins, so the light fades out on all four sides instead of bleeding
     off the paper). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; }
  .box { position: relative; width: 416px; height: 368px; overflow: hidden; background: #fff; }
  svg { position: absolute; top: -78px; right: -150px; width: 600px; height: 600px; transform: rotate(-4deg); opacity: .92; }
  /* soft on every side: the light fades into the paper before the reading starts */
  .fade {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, #fff 0, rgba(255,255,255,0) 9%, rgba(255,255,255,0) 52%, #fff 90%),
      linear-gradient(to right, #fff 0, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 86%, #fff 100%);
  }
</style>
</head>
<body>
<div class="box">
<svg viewBox="0 0 1000 1000" aria-hidden="true">
<defs>
<linearGradient id="light-grad" x1="0" y1="0" x2="1" y2="1">
<stop offset=".18" stop-color="#d4e6f4"/><stop offset=".5" stop-color="#f1e8df"/><stop offset=".82" stop-color="#f8dcc8"/>
</linearGradient>
<filter id="light-edge" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="light-leaf" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.4"/></filter>
<mask id="light-window" maskUnits="userSpaceOnUse" x="-500" y="-500" width="2000" height="2000">
<g filter="url(#light-edge)" fill="#fff" transform="translate(430 110) skewX(-15) skewY(8)">
<rect x="0" y="0" width="150" height="188" rx="3"/><rect x="166" y="0" width="150" height="188" rx="3"/>
<rect x="0" y="204" width="150" height="188" rx="3"/><rect x="166" y="204" width="150" height="188" rx="3"/>
<rect x="0" y="408" width="150" height="188" rx="3"/><rect x="166" y="408" width="150" height="188" rx="3"/>
</g>
</mask>
</defs>
<g mask="url(#light-window)">
<rect x="200" y="60" width="600" height="840" fill="url(#light-grad)"/>
<g filter="url(#light-leaf)" fill="#a9b9a3" opacity=".62">
<path fill="none" stroke="#a9b9a3" stroke-width="3.5" stroke-linecap="round" d="M960 60 C 870 120, 800 170, 700 250 S 560 380, 500 470"/>
<path d="M900 104c-26-30-68-34-92-16 25 27 62 34 92 16z"/><path d="M866 128c9-39-10-76-39-87-7 36 9 71 39 87z"/>
<path d="M816 164c-32-23-74-20-94 4 28 19 67 21 94-4z"/><path d="M786 186c14-37 2-78-25-92-12 34-2 73 25 92z"/>
<path d="M733 225c-35-16-76-5-90 21 32 12 71 5 90-21z"/><path d="M701 250c19-34 16-76-7-94-18 30-16 69 7 94z"/>
<path d="M651 291c-35-11-74 5-85 34 34 7 69-5 85-34z"/><path d="M618 321c25-30 28-73 7-94-21 27-25 66-7 94z"/>
<path d="M575 362c-37-5-73 16-80 46 34 2 67-16 80-46z"/><path d="M545 398c27-27 35-67 18-92-23 23-32 62-18 92z"/>
<path d="M515 442c-35 2-65 28-67 58 34-5 62-28 67-58z"/>
</g>
</g>
</svg>
<div class="fade"></div>
</div>
</body>
</html>
